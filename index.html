<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veridian</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b1030'/><rect x='6' y='3' width='4' height='10' fill='%23e8e6dc'/></svg>">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #8b8778;
  }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    pointer-events: none; opacity: .55; letter-spacing: .06em; font-size: 11px;
    transition: opacity .6s ease;
  }
  #hint.gone { opacity: 0; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #ddd; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hint">ARROWS / WASD move &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; E interact &nbsp;·&nbsp; TAB journal &nbsp;·&nbsp; F3 debug</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module">
  import { Game } from './src/game/game.js';

  const canvas = document.getElementById('game');
  const game = new Game(canvas);
  window.game = game;          // handy from the console and for the test harness
  canvas.focus();

  // The controls hint belongs to gameplay, so it waits for gameplay: printing
  // it over the opening narration puts a keyboard legend inside the picture.
  // It appears when the player first has control, and stays out of every
  // cutscene after that.
  const hint = document.getElementById('hint');
  let dismissed = false;
  let shownAt = 0;
  const dismiss = () => { dismissed = true; };
  window.addEventListener('keydown', dismiss, { once: true });
  setInterval(() => {
    const playing = game.state === 'playing';
    if (playing && !shownAt) shownAt = performance.now();
    const expired = shownAt && performance.now() - shownAt > 9000;
    hint.classList.toggle('gone', dismissed || expired || !playing);
  }, 200);

  game.boot();
</script>
</body>
</html>

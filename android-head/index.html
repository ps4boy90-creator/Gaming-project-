<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Android Head Anatomy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage with a docked instrument panel. Colour is reserved for anatomy; the interface stays monochrome. */
:root {
  --bg: #e6ebf1;
  --stage-hi: #fbfcfe;
  --stage-lo: #c9d2de;
  --grid: rgba(30, 50, 80, 0.07);
  --panel: #f5f7fa;
  --card: #ffffff;
  --ink: #121a27;
  --ink-2: #445168;
  --ink-3: #6c788c;
  --line: #d2d9e3;
  --line-2: #b4bfce;
  --focus: #0a6fd6;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --stage-hi: #232e41; --stage-lo: #06080c; --grid: rgba(170, 200, 255, 0.05);
    --panel: #0f141d; --card: #161d29; --ink: #e8edf5; --ink-2: #aab4c6; --ink-3: #7b879b;
    --line: #232c3b; --line-2: #36435a; --focus: #6fb6ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --stage-hi: #232e41; --stage-lo: #06080c; --grid: rgba(170, 200, 255, 0.05);
  --panel: #0f141d; --card: #161d29; --ink: #e8edf5; --ink-2: #aab4c6; --ink-3: #7b879b;
  --line: #232c3b; --line-2: #36435a; --focus: #6fb6ff; color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 31vw, 430px); }

/* ---------- stage ---------- */
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background-color: var(--stage-lo);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    radial-gradient(ellipse 75% 70% at 50% 42%, var(--stage-hi), var(--stage-lo));
  background-size: 44px 44px, 44px 44px, 100% 100%;
}
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.dragging { cursor: grabbing; }
.title {
  position: absolute; top: 0; left: 0; pointer-events: none;
  padding: 18px 20px 0 max(20px, env(safe-area-inset-left, 0px));
}
.kicker {
  margin: 0 0 6px; font: 500 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
h1 {
  margin: 0; font: 700 clamp(22px, 2.5vw, 32px)/0.98 var(--f-display); letter-spacing: 0.02em; text-transform: uppercase;

}
h1 span { color: var(--ink-3); }
.hint {
  position: absolute; top: 20px; right: 18px; margin: 0; pointer-events: none;
  font: 400 11px/1.3 var(--f-mono); color: var(--ink-3); text-align: right; max-width: 15em;
}
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding: 0 16px 14px max(16px, env(safe-area-inset-left, 0px));
}
.seg { display: inline-flex; align-items: stretch; border: 1px solid var(--line-2); background: var(--card); border-radius: 3px; overflow: hidden; }
.seg-label, .slider > span {
  font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
.seg-label { display: flex; align-items: center; padding: 0 9px; border-right: 1px solid var(--line); }
.seg button, .btn {
  border: 0; background: transparent; padding: 8px 11px; min-height: 34px;
  font: 600 14px/1 var(--f-display); letter-spacing: 0.05em; text-transform: uppercase;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"], .btn[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 3px; }
.btn:hover, .seg button:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.slider {
  display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 11px;
  border: 1px solid var(--line-2); background: var(--card); border-radius: 3px;
}
.slider input { width: 96px; accent-color: var(--ink); }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
  font: 500 11px/1 var(--f-mono); padding: 4px 6px; background: var(--ink); color: var(--card); border-radius: 2px;
}
.tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: var(--ink); }
.nogl {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2);
}

/* ---------- panel ---------- */
.panel {
  min-width: 0; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding-block: 18px 28px;
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.detail { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 16px 16px 14px; }
.eyebrow {
  display: flex; align-items: center; gap: 7px; margin: 0 0 8px;
  font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
.sw { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line-2); }
.detail h2 { margin: 0; font: 600 25px/1.05 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.bot { margin: 7px 0 0; font-size: 14px; color: var(--ink-2); }
.bot b { font-weight: 600; color: var(--ink); }
.detail p.text { margin: 11px 0 0; max-width: 62ch; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
.links-label { width: 100%; font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; min-height: 30px;
  border: 1px solid var(--line-2); background: transparent; border-radius: 99px; font-size: 13.5px; text-align: left;
}
.chip:hover { border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; counter-reset: step; }
.steps button {
  counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; width: 100%;
  padding: 8px 8px 8px 6px; border: 0; border-left: 2px solid var(--line); background: transparent; text-align: left;
}
.steps button::before { content: counter(step); font: 500 12px/1.5 var(--f-mono); color: var(--ink-3); text-align: right; }
.steps b { font: 600 17px/1.15 var(--f-display); letter-spacing: 0.02em; }
.steps span { grid-column: 2; font-size: 13.5px; color: var(--ink-2); display: none; margin-top: 3px; }
.steps button.on { border-left-color: var(--ink); background: var(--panel); }
.steps button.on span { display: block; }
.steps button.on::before { color: var(--ink); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line-2); }
.tabs button {
  border: 0; background: transparent; padding: 10px 4px 9px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  font: 600 16px/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.sys { border-bottom: 1px solid var(--line); }
.sys-head { display: flex; align-items: center; gap: 8px; }
.sys-open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 11px 0; border: 0; background: transparent; text-align: left;
}
.sys-open .names { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sys-open b { font: 600 18px/1.1 var(--f-display); letter-spacing: 0.02em; }
.sys-open i { font-style: normal; font-size: 13px; color: var(--ink-3); }
.sys-open .count { margin-left: auto; font: 400 12px/1 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sys-open .chev { width: 8px; height: 8px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform 0.15s; }
.sys-open[aria-expanded="true"] .chev { transform: rotate(45deg); }
.tog { position: relative; flex: none; display: inline-flex; align-items: center; padding: 8px 0 8px 4px; cursor: pointer; }
.tog input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tog-ui { width: 34px; height: 20px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; position: relative; transition: background 0.15s; }
.tog-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); transition: transform 0.15s, background 0.15s; }
.tog input:checked + .tog-ui { background: var(--ink); border-color: var(--ink); }
.tog input:checked + .tog-ui::after { transform: translateX(14px); background: var(--card); }
.tog input:focus-visible + .tog-ui { outline: 2px solid var(--focus); outline-offset: 2px; }
.parts { list-style: none; margin: 0; padding: 0 0 10px 20px; }
.parts button, .path {
  width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 7px 10px; border: 0; border-left: 2px solid var(--line);
  background: transparent; text-align: left;
}
.parts button:hover, .path:hover { border-left-color: var(--ink-3); }
.parts button.on, .path.on { border-left-color: var(--ink); background: var(--card); }
.parts span { font-weight: 500; }
.parts small, .path small { font-size: 13px; color: var(--ink-3); }
.paths { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.path { padding: 10px 12px; }
.path b { font: 600 18px/1.1 var(--f-display); letter-spacing: 0.02em; }
.note { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); max-width: 62ch; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 50%) minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
  .title { padding: 12px 16px 0 max(16px, env(safe-area-inset-left, 0px)); }
  .hint, .slider, #btn-spin, h1 br, h1 span { display: none; }
  .dock { padding-bottom: 10px; gap: 6px; }
  .seg button, .btn { padding: 7px 8px; font-size: 13px; }
  .seg-label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage" aria-label="3D model of the android head">
    <canvas id="view" aria-label="Android head. Drag to orbit, scroll or pinch to zoom, tap a part to inspect it."></canvas>
    <div class="tags" id="tags" aria-hidden="true"></div>
    <div class="nogl" id="nogl" hidden></div>
    <div class="title">
      <p class="kicker">Unit A-01 · life size · 65 parts</p>
      <h1>Android head<br><span>wired like<br>a human</span></h1>
    </div>
    <p class="hint">Drag to orbit. Scroll or pinch to zoom. Shift-drag to pan. Tap a part.</p>
    <div class="dock">
      <div class="seg" role="group" aria-label="Shell">
        <span class="seg-label">Shell</span>
        <button type="button" data-shell="glass" aria-pressed="true">Glass</button>
        <button type="button" data-shell="cut" aria-pressed="false">Cutaway</button>
        <button type="button" data-shell="solid" aria-pressed="false">Solid</button>
        <button type="button" data-shell="off" aria-pressed="false">Off</button>
      </div>
      <label class="slider"><span>Jaw</span><input type="range" id="jaw" min="0" max="100" value="0" aria-label="Open the jaw"></label>
      <button type="button" class="btn" id="btn-spin" aria-pressed="false">Spin</button>
      <button type="button" class="btn" id="btn-reset">Reset view</button>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div class="detail" id="detail" aria-live="polite"></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-systems" aria-controls="pane-systems" aria-selected="true">Systems</button>
      <button type="button" role="tab" id="tab-paths" aria-controls="pane-paths" aria-selected="false">Signal paths</button>
    </div>
    <div id="pane-systems" role="tabpanel" aria-labelledby="tab-systems"></div>
    <div id="pane-paths" role="tabpanel" aria-labelledby="tab-paths" hidden></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   DATA: systems, parts, signal paths
   ===================================================================== */
const SYS = [
  { id: 'chassis',   name: 'Skeleton',            bot: 'Chassis',              color: '#c8ced6' },
  { id: 'core',      name: 'Brain & spinal cord', bot: 'Compute core',         color: '#b59ad8' },
  { id: 'sensors',   name: 'Sense organs',        bot: 'Sensors',              color: '#58c7d8' },
  { id: 'nerves',    name: 'Nerves & tracts',     bot: 'Wiring harness',       color: '#f0c93a' },
  { id: 'actuators', name: 'Muscles',             bot: 'Actuators',            color: '#cc6242' },
  { id: 'fluid',     name: 'Blood supply',        bot: 'Coolant & power loop', color: '#d8404f' },
  { id: 'voice',     name: 'Airway & voice',      bot: 'Voice unit',           color: '#74c08a' }
];
const SYSMAP = {}; SYS.forEach(s => SYSMAP[s.id] = s);

// [id, system, human name, android build, description, connects to]
const PARTS = [
 ['shell','chassis','Skull & face','Cranial shell & face plate','Twenty-two bones fused into a vault that armours the brain and a face that carries the sense organs. Here it is a ceramic-composite shell in three panels (dome, face plate, jaw) with openings exactly where the eye sockets and ear canals sit.',['jaw','tmj','eye','earcanal','atlas']],
 ['jaw','chassis','Mandible','Jaw assembly','The only freely moving bone of the skull. It carries the lower teeth and swings on two joints just in front of the ears. Drag the Jaw slider to open it and watch the muscles follow.',['tmj','masseter','temporalis','digastric','cn5']],
 ['tmj','chassis','Temporomandibular joint','Jaw hinge bearing','A hinge that also slides: the jaw rotates for the first part of opening, then its head glides forward. The android copies it as a pinned bearing in the same spot.',['jaw','shell']],
 ['zygo','chassis','Cheekbone & upper jaw','Cheek strut & upper dental rail','The zygomatic arch is a bridge of bone on the side of the face. The masseter hangs from it and the temporalis passes underneath. The upper jaw holds the upper teeth and never moves.',['masseter','temporalis','zygomaticus']],
 ['atlas','chassis','Atlas (C1)','Nod bearing','A ring with no body. The skull rocks on its two cupped facets, which gives most of the "yes" nod.',['axis','shell','cord','vertebral']],
 ['axis','chassis','Axis (C2)','Pan pivot','Its upright peg, the dens, is the axle the atlas and skull turn around. About half of all neck rotation happens at this one joint.',['atlas','cspine','scm']],
 ['cspine','chassis','Cervical vertebrae C3–C7','Articulated neck column','Five stacked segments that share out bending and twisting. Each has a canal for the spinal cord and a hole in each side wing for the vertebral artery.',['axis','discs','cord','vertebral']],
 ['discs','chassis','Intervertebral discs','Elastomer dampers','Fibrous rings with a gel centre. They let neighbouring vertebrae tilt a few degrees and absorb shock.',['cspine']],
 ['hyoid','chassis','Hyoid bone','Floating suspension yoke','A U-shaped bone that touches no other bone. It hangs in a sling of muscles and anchors the tongue above and the larynx below.',['digastric','larynx','tongue']],

 ['frontal','core','Frontal lobe','Planner & motor controller','Plans, decides and issues movement commands. Its rear strip, the motor cortex, holds a map of the body\'s muscles.',['m1','broca','parietal','corticobulbar','cerebral']],
 ['parietal','core','Parietal lobe','Sensor-fusion processor','Builds the body map: touch, limb position and where things are in space. Its front strip receives touch from the face and body.',['s1','frontal','occipital','touchpath']],
 ['temporal','core','Temporal lobe','Audio processor & memory index','Decodes sound and speech, recognises objects and faces, and houses the hippocampus, which files new memories.',['a1','piriform','audpath','cn1']],
 ['occipital','core','Occipital lobe','Vision processor','Almost entirely devoted to sight. Each half of the visual field lands on the opposite side of the brain.',['v1','optrad']],
 ['cerebellum','core','Cerebellum','Motion coprocessor','A tenth of the brain\'s volume but most of its neurons. It compares intended movement with actual movement and corrects the timing, and it calibrates the reflex that steadies the eyes.',['pons','vestibular','mlf']],
 ['thalamus','core','Thalamus','Sensor router','Every sense except smell relays here before reaching the cortex. Separate nuclei handle vision, hearing and touch.',['lgn','mgn','touchpath','parietal']],
 ['lgn','core','Lateral geniculate nucleus','Video relay','The thalamic stop for vision. Optic tract fibres end here in six layers, and the next neurons run on to the visual cortex.',['cn2','optrad','thalamus']],
 ['mgn','core','Medial geniculate nucleus','Audio relay','The thalamic stop for hearing, between the midbrain and the auditory cortex.',['audpath','a1','thalamus']],
 ['callosum','core','Corpus callosum','Inter-core bus','Roughly 200 million fibres joining matching areas of the two hemispheres, so each side knows what the other is doing.',['frontal','parietal']],
 ['midbrain','core','Midbrain','Orienting & gimbal controller','Holds the nuclei that drive most of the eye muscles, plus reflex centres that swing the eyes and head toward a sudden sight or sound.',['cn346','mlf','audpath','pons']],
 ['pons','core','Pons','Relay bridge','Bridges the cortex to the cerebellum and holds the nuclei for face sensation, chewing, facial expression, hearing and balance.',['cn5','cn7','cn8','cerebellum','medulla','midbrain']],
 ['medulla','core','Medulla oblongata','Life-support firmware','Runs heartbeat, breathing and swallowing without being asked. The nerves to the tongue, throat and voice box leave from here.',['cn10','cn12','cn11','cord','pons']],
 ['cord','core','Spinal cord','Main data trunk','About a centimetre across. It carries every motor command down to the body and every body sensation back up, protected inside the vertebral canal.',['medulla','cspine','atlas']],
 ['v1','core','Primary visual cortex (V1)','Frame buffer','The first cortical map of the image, laid out point for point with the retina.',['optrad','occipital']],
 ['a1','core','Primary auditory cortex (A1)','Spectrum map','Arranged by pitch, like the cochlea that feeds it.',['mgn','audpath','temporal']],
 ['m1','core','Motor cortex, face area','Face motor driver','The lower end of the motor strip. It drives the jaw, lips, tongue and larynx, and gives these small muscles a large share of cortex.',['corticobulbar','frontal','broca']],
 ['s1','core','Somatosensory cortex, face area','Touch map','Receives touch from the opposite side of the face. Lips and tongue get the biggest share.',['touchpath','parietal']],
 ['broca','core','Broca\'s area','Speech sequencer','In the left frontal lobe in most people. It turns an intended sentence into the ordered motor plan for saying it.',['m1','frontal']],
 ['piriform','core','Piriform cortex','Odour classifier','Primary smell cortex on the inner temporal lobe. Smell arrives here directly, with no relay in the thalamus.',['cn1','temporal','olfactory']],

 ['eye','sensors','Eye','Camera module','A 24 mm globe. Cornea and lens focus the light, the iris sets the aperture, and about 126 million photoreceptors in the retina turn it into signals.',['cn2','eom','cn346','shell']],
 ['earcanal','sensors','Outer ear & ear canal','Acoustic collector & waveguide','The outer ear gathers sound, and its folds colour the sound according to direction. The canal, about 2.5 cm long, carries it to the eardrum.',['ossicles','shell']],
 ['ossicles','sensors','Eardrum & ossicles','Diaphragm & lever chain','Three tiny bones (malleus, incus, stapes) lever the eardrum\'s movement onto the cochlea\'s oval window, matching vibration in air to vibration in fluid.',['earcanal','cochlea']],
 ['cochlea','sensors','Cochlea','Frequency analyser','A fluid-filled spiral of about two and a half turns. High pitches peak near the base and low pitches near the tip, so position along the spiral encodes frequency.',['ossicles','cn8','vestibular']],
 ['vestibular','sensors','Semicircular canals & vestibule','Inertial measurement unit','Three fluid loops at right angles sense rotation about three axes. Two otolith organs in the vestibule sense straight-line acceleration and gravity.',['cn8','cochlea','cerebellum','mlf']],
 ['olfactory','sensors','Olfactory epithelium & bulb','Chemical sensor array','Receptor cells in the roof of the nose send fine fibres up through a sieve-like plate of the skull into the bulb, which sorts the signal by receptor type.',['cn1','piriform']],
 ['tongue','sensors','Tongue','Articulator & taste pad','A muscle with no skeleton. It changes shape by squeezing against itself, shapes speech sounds and carries the taste buds.',['cn12','jaw','hyoid']],

 ['cn2','nerves','Optic nerve, chiasm & tract (CN II)','Video bus','About a million fibres per eye. At the chiasm the fibres from the nasal half of each retina cross, so each side of the brain receives the opposite half of the view from both eyes.',['eye','lgn','optrad','willis']],
 ['optrad','nerves','Optic radiation','Video bus, final leg','Fans from the thalamus to the back of the brain. Its lower fibres loop forward through the temporal lobe before turning back.',['lgn','v1','occipital','temporal']],
 ['cn346','nerves','Oculomotor, trochlear & abducens nerves (CN III, IV, VI)','Gimbal drive lines','Three nerves share six eye muscles. VI drives the lateral rectus, IV the superior oblique, and III the other four.',['midbrain','eom','eye','mlf']],
 ['cn5','nerves','Trigeminal nerve (CN V)','Face touch harness & jaw motor line','The main sensory nerve of the face, in three divisions: forehead and eye, cheek and upper lip, jaw and lower lip. The third division also drives the chewing muscles.',['pons','masseter','temporalis','digastric','touchpath','jaw']],
 ['touchpath','nerves','Trigeminothalamic tract','Touch data bus','Carries face touch from the pons across the midline to the thalamus, then up to the touch map.',['cn5','thalamus','s1']],
 ['cn7','nerves','Facial nerve (CN VII)','Expression actuator harness','Threads through the temporal bone beside the inner ear, exits behind the jaw and fans into five branches that drive every muscle of facial expression.',['pons','zygomaticus','orbicularis','digastric','corticobulbar']],
 ['cn8','nerves','Vestibulocochlear nerve (CN VIII)','Audio & IMU cable','Two bundles in one sheath. The cochlear nerve carries sound and the vestibular nerve carries head motion.',['cochlea','vestibular','pons','audpath','mlf']],

    if (ptrs.size === 1) { moved = 0; downT = performance.now(); }
    if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) onUser();
    if (ptrs.size === 1) {
      if (e.shiftKey || e.buttons === 2) pan(dx, dy);
      else { cam.th -= dx * 0.008; cam.ph = clamp(cam.ph + dy * 0.008, -1.35, 1.45); }
    } else if (ptrs.size === 2) {
      const a = [...ptrs.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (pinch) cam.r = clamp(cam.r * pinch / d, 14, 110);
      pinch = d; pan(dx * 0.5, dy * 0.5);
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0;
    if (!ptrs.size) { canvas.classList.remove('dragging'); if (e.type === 'pointerup' && moved < 6 && performance.now() - downT < 600) pick(e.clientX, e.clientY); }
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => { e.preventDefault(); onUser(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.0012), 14, 110); }, { passive: false });
  function pan(dx, dy) {
    const k = cam.r * fit * 0.0011, right = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), upv = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    cam.tx -= right.x * dx * k - upv.x * dy * k; cam.ty -= right.y * dx * k - upv.y * dy * k; cam.tz -= right.z * dx * k - upv.z * dy * k;
    cam.tx = clamp(cam.tx, -12, 12); cam.ty = clamp(cam.ty, -18, 12); cam.tz = clamp(cam.tz, -12, 12);
  }
  const ray = new T.Raycaster(), ndc = new T.Vector2();
  function pick(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height * 2 - 1));
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(pickables.filter(m => m.visible), false);
    let solid = null, ghost = null, shell = null;
    for (const h of hits) {
      const m = h.object, id = m.userData.part;
      if (m.userData.shell) {
        if (state.shell === 'cut' && clipWorld.distanceToPoint(h.point) < 0) continue;
        if (!shell) shell = h;
        if ((state.shell === 'solid' || state.shell === 'cut') && !state.focus && !solid) { solid = h; break; }
        continue;
      }
      const isGhost = state.focus && !state.focus.get(id);
      if (isGhost) { if (!ghost) ghost = h; continue; }
      solid = h; break;
    }
    const h = solid || ghost || (state.shell !== 'off' && state.shell !== 'glass' ? shell : null);
    UI.select(h ? h.object.userData.part : null);
  }

  /* ---------- frame loop ---------- */
  const tagEls = new Map(), v = new T.Vector3();
  let last = performance.now(), time = 0, yaw = 0, speakJaw = 0;
  function setJaw(a) {
    if (Math.abs(a - jawAngle) < 0.0015) return;
    jawAngle = a; jaw.rotation.x = a; DYN.forEach(rebuildTube);
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    const pid = state.path ? state.path.id : null;

    if (state.spin) cam.th += dt * 0.25;
    if (goal) {
      const k = 1 - Math.exp(-dt * 4); let far = 0;
      for (const key in goal) { let d = goal[key] - cam[key]; if (key === 'th') d = Math.atan2(Math.sin(d), Math.cos(d)); cam[key] += d * k; far += Math.abs(d); }
      if (far < 0.01) goal = null;
    }
    placeCamera();

    // demonstrations attached to signal paths
    const wantYaw = pid === 'vor' && !state.paused ? 0.32 * Math.sin(time * 1.7) : 0;
    yaw += (wantYaw - yaw) * Math.min(1, dt * 8);
    head.rotation.y = yaw;
    const gx = pid === 'see' ? 0.22 * Math.sin(time * 0.9) : -yaw, gy = pid === 'see' ? 0.1 * Math.sin(time * 1.4) : 0;
    eyes.L.rotation.set(gy, gx, 0); eyes.R.rotation.set(gy, gx, 0);
    const talk = pid === 'speak' && state.step >= 3 && !state.paused ? Math.max(0, 0.42 + 0.4 * Math.sin(time * 8.5) * Math.sin(time * 2.7 + 1)) : 0;
    speakJaw += (talk - speakJaw) * Math.min(1, dt * 14);
    setJaw(Math.max(state.jaw, speakJaw) * JAW_MAX);

    head.updateMatrixWorld(true);
    clipWorld.copy(clipLocal).applyMatrix4(head.matrixWorld);

    // glow on highlighted parts
    const pulse = 0.5 + 0.28 * Math.sin(time * 4.2);
    state.glow.forEach(id => {
      PART[id].meshes.forEach(m => { const mt = m.material; if (mt.emissive) { mt.emissive.copy(m.userData.glow); mt.emissiveIntensity = m.userData.shell ? pulse * 0.4 : pulse; } });
    });

    // travelling pulses
    let pi = 0;
    for (const sp of activeSpecs) {
      const curve = CURVES[sp.n]; if (!curve) continue;
      const len = curve.getLength() * (sp.b - sp.a), per = clamp(len / 8, 0.8, 2.6), n = len > 5 ? 4 : len > 1.6 ? 3 : 2;
      for (let i = 0; i < n && pi < pulses.length; i++) {
        const u = (time / per + i / n) % 1, t = sp.a + (sp.b - sp.a) * (sp.rev ? 1 - u : u), p = pulses[pi++];
        curve.getPointAt(clamp(t, 0, 1), p.position);
        p.scale.setScalar(0.19 * (0.45 + 0.55 * Math.sin(Math.PI * u)));
        p.material.color.copy(sp.color).lerp(WHITE, 0.45); p.children[0].material.color.copy(sp.color); p.visible = true;
      }
    }
    for (; pi < pulses.length; pi++) pulses[pi].visible = false;

    // advance signal path
    if (state.path && !state.paused) {
      state.stepT += dt;
      if (state.stepT > 4.2) UI.gotoStep((state.step + 1) % state.path.steps.length);
    }

    renderer.render(scene, camera);

    // labels
    const w = stage.clientWidth, h = stage.clientHeight, tagsEl = document.getElementById('tags');
    const want = new Set(state.tags);
    tagEls.forEach((el, id) => { if (!want.has(id)) { el.remove(); tagEls.delete(id); } });
    const placed = [];
    want.forEach(id => {
      const part = PART[id]; if (!part || !part.anchor) return;
      let el = tagEls.get(id);
      if (!el) { el = document.createElement('div'); el.className = 'tag'; el.textContent = part.bot; tagsEl.appendChild(el); tagEls.set(id, el); }
      v.copy(part.anchor);
      (part.meshes[0].parent || head).localToWorld(v); v.project(camera);
      const x = clamp((v.x * 0.5 + 0.5) * w, 40, w - 40); let y = clamp((-v.y * 0.5 + 0.5) * h - 16, 54, h - 70);
      const hw = (el.offsetWidth || 120) / 2 + 4;
      for (const q of placed) if (Math.abs(q.x - x) < hw + q.hw && Math.abs(q.y - y) < 24) y = q.y + 26;
      placed.push({ x, y, hw });
      el.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(-50%,-100%)';
      el.style.opacity = v.z < 1 ? 1 : 0;
    });
  }
  const WHITE = new T.Color(0xffffff);
  refresh(); placeCamera();
  requestAnimationFrame(frame);

  return {
    refresh, setSpecs,
    view(th, ph, r, instant, t) { t = t || [HOME.tx, HOME.ty, HOME.tz]; const g = { th, ph, r, tx: t[0], ty: t[1], tz: t[2] }; if (instant) { Object.assign(cam, g); goal = null; } else goal = g; },
    home() { goal = Object.assign({}, HOME); },
    focusOn(id) { },
    userTouched: () => userTouched,
    T, scene, head, camera, renderer, PART, CURVES
  };
}

/* =====================================================================
   INTERFACE
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const UI = {
  build() {
    const sysEl = $('pane-systems'), counts = {};
    ORDER.forEach(id => counts[PART[id].sys] = (counts[PART[id].sys] || 0) + 1);
    sysEl.innerHTML = SYS.map(s => `
      <section class="sys" data-sys="${s.id}">
        <div class="sys-head">
          <button type="button" class="sys-open" aria-expanded="false" aria-controls="list-${s.id}">
            <span class="sw" style="background:${s.color}"></span>
            <span class="names"><b>${esc(s.bot)}</b><i>${esc(s.name)}</i></span>
            <span class="count">${counts[s.id]}</span><span class="chev"></span>
          </button>
          <label class="tog"><input type="checkbox" id="sys-${s.id}" checked><span class="tog-ui"></span><span class="sr">Show ${esc(s.bot.toLowerCase())}</span></label>
        </div>
        <ul class="parts" id="list-${s.id}" hidden>
          ${ORDER.filter(id => PART[id].sys === s.id).map(id => `<li><button type="button" data-part="${id}"><span>${esc(PART[id].bot)}</span><small>${esc(PART[id].name)}</small></button></li>`).join('')}
        </ul>
      </section>`).join('') + '<p class="note">Android part on top, the human original it stands in for underneath. The switch hides a whole system.</p>';
    $('pane-paths').innerHTML = '<ul class="paths">' + PATHS.map(p => `<li><button type="button" class="path" data-path="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.sub)}</small></button></li>`).join('') + '</ul><p class="note">Each path follows the real route, relay by relay. Yellow pulses are signals, red is coolant supply and blue is return.</p>';

    sysEl.addEventListener('click', e => {
      const open = e.target.closest('.sys-open');
      if (open) { const on = open.getAttribute('aria-expanded') !== 'true'; open.setAttribute('aria-expanded', on); $(open.getAttribute('aria-controls')).hidden = !on; return; }
      const b = e.target.closest('[data-part]'); if (b) UI.select(b.dataset.part);
    });
    sysEl.addEventListener('change', e => { if (e.target.id && e.target.id.indexOf('sys-') === 0) { state.sys[e.target.id.slice(4)] = e.target.checked; G && G.refresh(); } });
    $('pane-paths').addEventListener('click', e => { const b = e.target.closest('[data-path]'); if (b) UI.play(b.dataset.path); });
    $('detail').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.part) UI.select(b.dataset.part);
      else if (b.dataset.step) UI.gotoStep(+b.dataset.step);
      else if (b.id === 'clear') UI.select(null);
      else if (b.id === 'path-stop') UI.stop();
      else if (b.id === 'path-pause') { state.paused = !state.paused; b.textContent = state.paused ? 'Resume' : 'Pause'; b.setAttribute('aria-pressed', state.paused); }
    });
    document.querySelectorAll('[data-shell]').forEach(b => b.addEventListener('click', () => {
      state.shell = b.dataset.shell;
      document.querySelectorAll('[data-shell]').forEach(o => o.setAttribute('aria-pressed', o === b));
      G && G.refresh();
    }));
    $('jaw').addEventListener('input', e => { state.jaw = e.target.value / 100; });
    $('btn-spin').addEventListener('click', () => { state.spin = !state.spin; UI.syncSpin(); });
    $('btn-reset').addEventListener('click', () => { G && G.home(); });
    const tabs = [['tab-systems', 'pane-systems'], ['tab-paths', 'pane-paths']];
    tabs.forEach(t => $(t[0]).addEventListener('click', () => tabs.forEach(o => { $(o[0]).setAttribute('aria-selected', o === t); $(o[1]).hidden = o !== t; })));
    UI.detail();
  },
  syncSpin() { $('btn-spin').setAttribute('aria-pressed', state.spin); },
  focus() {
    if (state.path) {
      const st = state.path.steps[state.step], f = new Map();
      state.path.parts.forEach(id => f.set(id, BULK.has(id) ? 'ctx' : 'solid'));
      state.focus = f; state.glow = new Set(st.glow); state.tags = st.glow.slice(0, 3);
    } else if (state.sel) {
      const f = new Map(); PART[state.sel].links.forEach(id => f.set(id, BULK.has(id) ? 'ctx' : 'solid')); f.set(state.sel, 'solid');
      state.focus = f; state.glow = new Set([state.sel]); state.tags = [state.sel];
    } else { state.focus = null; state.glow = new Set(); state.tags = []; }
    if (G) { G.refresh(); G.setSpecs(state.path ? state.path.steps[state.step] : null); }
  },
  select(id) {
    if (id && !PART[id]) return;
    if (state.path) { if (!id) return; state.path = null; }
    state.sel = id;
    if (id && !state.sys[PART[id].sys]) { state.sys[PART[id].sys] = true; $('sys-' + PART[id].sys).checked = true; }
    UI.focus(); UI.detail(); UI.mark();
  },
  play(pid) {
    const p = PATHS.find(x => x.id === pid); if (!p) return;
    state.sel = null; state.path = p; state.step = 0; state.stepT = 0; state.paused = false;
    UI.focus(); UI.detail(); UI.mark();
    if (G) G.view(p.view[0], p.view[1], p.view[2], false, p.target);
    $('panel').scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  },
  gotoStep(i) {
    if (!state.path) return;
    state.step = i; state.stepT = 0; UI.focus();
    document.querySelectorAll('.steps button').forEach((b, k) => { b.classList.toggle('on', k === i); if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  },
  stop() { state.path = null; state.sel = null; UI.focus(); UI.detail(); UI.mark(); },
  mark() {
    document.querySelectorAll('[data-part]').forEach(b => { if (b.closest('.parts')) b.classList.toggle('on', b.dataset.part === state.sel); });
    document.querySelectorAll('[data-path]').forEach(b => b.classList.toggle('on', !!state.path && b.dataset.path === state.path.id));
    if (state.sel) {
      const sys = PART[state.sel].sys, open = document.querySelector('.sys[data-sys="' + sys + '"] .sys-open');
      if (open && open.getAttribute('aria-expanded') !== 'true') { open.setAttribute('aria-expanded', 'true'); $('list-' + sys).hidden = false; }
    }
  },
  detail() {
    const el = $('detail');
    if (state.path) {
      const p = state.path;
      el.innerHTML = `<p class="eyebrow">Signal path</p><h2>${esc(p.name)}</h2><p class="bot">${esc(p.sub)}</p>
        <ol class="steps">${p.steps.map((s, i) => `<li><button type="button" data-step="${i}" class="${i === state.step ? 'on' : ''}"><b>${esc(s.t)}</b><span>${esc(s.d)}</span></button></li>`).join('')}</ol>
        <div class="row"><button type="button" class="btn" id="path-pause" aria-pressed="false">Pause</button><button type="button" class="btn" id="path-stop">Stop</button></div>`;
    } else if (state.sel) {
      const p = PART[state.sel], s = SYSMAP[p.sys];
      el.innerHTML = `<p class="eyebrow"><span class="sw" style="background:${s.color}"></span>${esc(s.bot)}</p>
        <h2>${esc(p.bot)}</h2><p class="bot">Stands in for the human <b>${esc(p.name)}</b></p>
        <p class="links-label" style="margin:13px 0 0">How the original works</p><p class="text" style="margin-top:5px">${esc(p.text)}</p>
        <div class="links"><span class="links-label">Plugs into</span>${p.links.map(id => `<button type="button" class="chip" data-part="${id}" title="${esc(PART[id].name)}"><span class="sw" style="background:${SYSMAP[PART[id].sys].color}"></span>${esc(PART[id].bot)}</button>`).join('')}</div>
        <div class="row"><button type="button" class="btn" id="clear">Show everything</button></div>`;
    } else {
      el.innerHTML = `<p class="eyebrow">How to read it</p><h2>A machine laid out like a body</h2>
        <p class="text">Cameras, microphones, processor modules, actuators, cable harnesses and coolant hoses. Each one is mounted where the human part it replaces sits and plugs into the same neighbours. Tap a part to isolate it with everything it connects to, or play a signal path to follow a message from sensor to processor to actuator.</p>
        <div class="row"><button type="button" class="btn" data-go="see" id="demo">Play the sight path</button></div>`;
      $('demo').addEventListener('click', () => { $('tab-paths').click(); UI.play('see'); });
    }
  }
};

UI.build();
try {
  if (!window.THREE) throw new Error('3D library did not load');
  G = initGraphics();
  if (!reduceMotion) { state.spin = false; }
} catch (err) {
  const n = $('nogl'); n.hidden = false;
  n.textContent = 'The 3D view could not start in this browser. The part list and descriptions still work.';
  if (window.console) console.error(err);
}
window.__head = { state, UI, get G() { return G; }, PART, PATHS };
})();
</script>
</body>
</html>

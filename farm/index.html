<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0f1e'/><rect x='5' y='7' width='6' height='6' fill='%23ffb060'/></svg>">
<style>
  /* One screen: the picture fills it, and everything else is a camcorder's
     on-screen display laid over the top in the corners. */
  :root {
    color-scheme: dark;
    --night: #04060c;                 /* behind the picture */
    --osd: #e8e4d6;                   /* display text */
    --osd-dim: #a39f92;
    --lamp: #ffb060;                  /* the porch light: anything switched on */
    --plate: rgba(8, 11, 20, 0.62);   /* button backing */
    --edge: rgba(232, 228, 214, 0.34);
    --osd-font: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--osd); overflow: hidden; position: relative;
    font: 15px/1.5 var(--osd-font); -webkit-user-select: none; user-select: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer;
    touch-action: none; outline: none; }

  /* The overlay keeps text and buttons off the screen edges; the picture runs under it. */
  #hud { position: absolute; inset: 0; pointer-events: none; display: grid;
    grid-template-rows: auto 1fr auto; padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #osd { display: flex; justify-content: space-between; letter-spacing: .12em; opacity: 0;
    transition: opacity 1s ease; text-shadow: 0 0 5px #000, 0 1px 0 #000; font-size: 1.15em; }
  #osd.on { opacity: .82; }
  #counter { font-variant-numeric: tabular-nums; }

  #title { align-self: end; transition: opacity 1.2s ease; text-shadow: 0 0 8px #000, 0 1px 0 #000; padding-bottom: 4vh; }
  #title.gone { opacity: 0; }
  #title h1 { margin: 0 0 .35em; font-size: clamp(26px, 5vw, 44px); line-height: 1; letter-spacing: .3em;
    font-weight: 400; text-wrap: balance; }
  #title p { margin: 0; color: var(--osd-dim); letter-spacing: .06em; max-width: 60ch; }
  #title .go { color: var(--lamp); }
  .for-touch { display: none; }
  @media (pointer: coarse) { .for-touch { display: inline; } .for-keys { display: none; } }

  /* The middle of the picture: a dot to aim with, what it is aimed at, and
     whatever that thing has to say for itself. */
  #dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: var(--osd); opacity: .5; pointer-events: none; }
  #centre { align-self: end; justify-self: center; text-align: center; padding-bottom: 9vh;
    text-shadow: 0 0 6px #000, 0 1px 0 #000; letter-spacing: .08em; }
  #prompt .key { display: inline-block; min-width: 1.5em; padding: 0 .35em; margin-right: .6em;
    border: 1px solid var(--edge); border-radius: 3px; background: var(--plate); color: var(--lamp); }
  #say { margin-top: .5em; color: var(--osd); font-size: 1.1em; }
  #title, #centre { grid-row: 2; grid-column: 1; }
  .touch #prompt .key { display: none; }
  #pad { display: none; justify-content: flex-end; gap: 10px; }
  .touch #pad { display: flex; }
  #pad button { pointer-events: auto; font: inherit; letter-spacing: .1em; color: var(--osd);
    background: var(--plate); border: 1px solid var(--edge); border-radius: 3px;
    min-width: 76px; min-height: 48px; padding: 0 14px; }
  #pad button[aria-pressed="true"] { color: var(--lamp); border-color: var(--lamp); }
  #pad #use { color: var(--lamp); border-color: var(--lamp); min-width: 96px; }
  #pad #use:disabled { color: var(--osd-dim); border-color: var(--edge); opacity: .45; }
  #pad button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    border: 1px solid var(--edge); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: var(--edge); }
  #error { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 2em; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #osd, #title { transition: none; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="A farmhouse and barn at night"></canvas>
<div id="hud">
  <div id="osd"><span>PLAY &#9658;</span><span id="counter">0:00:00</span></div>
  <div id="title">
    <h1>THE FARM</h1>
    <p class="for-keys"><span class="go">CLICK TO WALK</span> &nbsp;·&nbsp; WASD move &nbsp;·&nbsp; MOUSE look &nbsp;·&nbsp; E or click to use &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; F torch &nbsp;·&nbsp; V tape filter</p>
    <p class="for-touch"><span class="go">TAP TO WALK</span> &nbsp;·&nbsp; left thumb moves &nbsp;·&nbsp; right thumb looks &nbsp;·&nbsp; USE opens doors</p>
  </div>
  <div id="centre">
    <div id="prompt" hidden><span class="key">E</span><span id="what"></span></div>
    <div id="say" hidden></div>
  </div>
  <div id="pad">
    <button id="use" type="button" disabled>USE</button>
    <button id="tape" type="button" aria-pressed="true">TAPE</button>
    <button id="run" type="button" aria-pressed="false">RUN</button>
    <button id="torch" type="button" aria-pressed="false">TORCH</button>
  </div>
</div>
<div id="dot" hidden></div>
<div id="stick" hidden><div id="knob"></div></div>
<div id="error" hidden></div>
<noscript>This scene needs JavaScript.</noscript>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
